<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khet - Laser Chess</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Khet - Laser Chess</h1>
      </header>
      
      <main>
        <div id="game-board" class="board"></div>

        <div id="new-game-overlay" class="game-over-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="new-game-title">
          <form id="new-game-form" class="game-over-content new-game-content">
            <h2 id="new-game-title">New Game</h2>
            <label for="new-game-setup">Setup</label>
            <select id="new-game-setup">
              <option value="classic">Classic</option>
              <option value="imhotep">Imhotep</option>
              <option value="dynasty">Dynasty</option>
            </select>
            <label for="new-game-mode">Opponent</label>
            <select id="new-game-mode">
              <option value="computer">vs Computer</option>
              <option value="local">Human player</option>
            </select>
            <div id="computer-options" class="hidden">
              <label for="computer-side">Your side</label>
              <select id="computer-side">
                <option value="2">Silver (moves first)</option>
                <option value="1">Red</option>
              </select>
              <label for="computer-level">Level</label>
              <select id="computer-level"></select>
            </div>
            <div class="new-game-buttons">
              <button id="cancel-new-game" type="button" class="btn btn-secondary">Cancel</button>
              <button type="submit" class="btn btn-primary">Start Game</button>
            </div>
          </form>
        </div>
        
        <!-- Game Over Overlay -->
        <div id="game-over-overlay" class="game-over-overlay hidden">
          <div class="game-over-content">
            <h2 id="winner-text" class="winner-text"></h2>
            <button id="play-again-btn" class="btn btn-primary">Play Again</button>
          </div>
        </div>
        
        <div class="controls">
          <span id="computer-status" class="sync-indicator hidden" role="status" aria-live="polite"></span>
          <span id="sync-indicator" class="sync-indicator hidden">Offline</span>
          <div class="share-menu-container">
            <button id="share-menu-btn" class="btn btn-secondary">Share</button>
            <div id="share-menu" class="share-menu hidden">
              <button id="play-online-btn" class="share-menu-item share-menu-item--highlight hidden">Play Online</button>
              <button id="invite-btn" class="share-menu-item hidden">Invite Opponent</button>
              <button id="copy-session-id-btn" class="share-menu-item hidden">Copy Session Link</button>
              <button id="leave-online-btn" class="share-menu-item share-menu-item--danger hidden">Leave Online Game</button>
              <div class="share-menu-divider"></div>
              <button id="copy-link-btn" class="share-menu-item">Copy Link</button>
              <button id="share-btn" class="share-menu-item">Share via...</button>
              <button id="show-qr-btn" class="share-menu-item">Show QR Code</button>
              <button id="paste-link-btn" class="share-menu-item">Paste Opponent Link</button>
            </div>
          </div>
          <button id="reset-game" class="btn btn-secondary">Reset Game</button>
        </div>
        
        <!-- Turn Overlay -->
        <div id="turn-overlay" class="turn-overlay hidden">
          <div class="turn-overlay-content">
            <h2 class="turn-title">It's your turn!</h2>
            <p class="turn-summary hidden"></p>
            <button id="start-turn-btn" class="btn btn-primary">Start Turn</button>
          </div>
        </div>
        
        <!-- Invite Modal -->
        <div id="invite-modal" class="invite-modal hidden">
          <div class="invite-modal-content">
            <h2>Invite Opponent</h2>
            <p class="invite-subtitle">Share this link or code with your opponent</p>
            
            <div class="invite-qr-container">
              <canvas class="invite-qr"></canvas>
            </div>
            
            <div class="invite-code-container">
              <label>Session Code</label>
              <div class="invite-code-row">
                <span class="invite-code"></span>
                <button id="copy-code-btn" class="btn btn-small">Copy</button>
              </div>
            </div>
            
            <div class="invite-link-container">
              <label>Share Link</label>
              <div class="invite-link-row">
                <input type="text" class="invite-link" readonly />
                <button id="copy-invite-link-btn" class="btn btn-small">Copy</button>
              </div>
            </div>
            
            <p class="invite-waiting">Waiting for opponent to join...</p>
            
            <button id="close-invite-btn" class="btn btn-secondary">Close</button>
          </div>
        </div>
        
        <!-- QR Code Overlay -->
        <div id="qr-overlay" class="qr-overlay hidden">
          <div class="qr-overlay-content">
            <h2>Scan to Continue Game</h2>
            <canvas id="qr-canvas"></canvas>
            <div class="qr-overlay-buttons">
              <button id="qr-copy-btn" class="btn btn-primary">Copy Link</button>
              <button id="qr-close-btn" class="btn btn-secondary">Close</button>
            </div>
          </div>
        </div>
      </main>
    </div>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
