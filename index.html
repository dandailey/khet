<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khet - Laser Chess</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Khet - Laser Chess</h1>
      </header>
      
      <main>
        <div id="game-board" class="board"></div>
        
        <!-- Game Over Overlay -->
        <div id="game-over-overlay" class="game-over-overlay hidden">
          <div class="game-over-content">
            <h2 id="winner-text" class="winner-text"></h2>
            <button id="play-again-btn" class="btn btn-primary">Play Again</button>
          </div>
        </div>
        
        <div class="controls">
          <div class="share-menu-container">
            <button id="share-menu-btn" class="btn btn-secondary">Share</button>
            <div id="share-menu" class="share-menu hidden">
              <button id="copy-link-btn" class="share-menu-item">Copy Link</button>
              <button id="share-btn" class="share-menu-item">Share via...</button>
              <button id="show-qr-btn" class="share-menu-item">Show QR Code</button>
              <button id="paste-link-btn" class="share-menu-item">Paste Opponent Link</button>
            </div>
          </div>
          <button id="reset-game" class="btn btn-secondary">Reset Game</button>
        </div>
        
        <!-- QR Code Overlay -->
        <div id="qr-overlay" class="qr-overlay hidden">
          <div class="qr-overlay-content">
            <h2>Scan to Continue Game</h2>
            <canvas id="qr-canvas"></canvas>
            <div class="qr-overlay-buttons">
              <button id="qr-copy-btn" class="btn btn-primary">Copy Link</button>
              <button id="qr-close-btn" class="btn btn-secondary">Close</button>
            </div>
          </div>
        </div>
      </main>
    </div>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
